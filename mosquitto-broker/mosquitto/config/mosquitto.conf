# Development broker configuration.
persistence true
persistence_location /mosquitto/data/

listener 1883
allow_anonymous true

# WebSocket listener, useful for browser-based MQTT clients.
listener 9001
protocol websockets
allow_anonymous true

log_dest stdout
# Keep the demo terminal clean: the dashboard reports successful forwarding.
# Excluding `information` hides verbose per-PUBLISH lines.
log_type error
log_type warning
log_type notice
