services:
  mqtt-ingestor:
    build: .
    container_name: agribot_mqtt_ingestor
    restart: unless-stopped
    command: ["python", "mqtt_ingestor.py"]
    env_file:
      - .env
    environment:
      AGRIBOT_DB_PATH: /data/agribot.db
      MQTT_HOST: host.docker.internal
      MQTT_PORT: "1883"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - agribot-data:/data

  bot:
    build: .
    container_name: agribot_telegram_bot
    restart: unless-stopped
    command: ["python", "bot.py"]
    env_file:
      - .env
    environment:
      AGRIBOT_DB_PATH: /data/agribot.db
      MQTT_HOST: host.docker.internal
      MQTT_PORT: "1883"
      PUBLISH_INTERVAL_FILE: /nttq/publish_interval_seconds.txt
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - agribot-data:/data
      - ../nttq:/nttq
    depends_on:
      - mqtt-ingestor

volumes:
  agribot-data:
